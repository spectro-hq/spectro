name: spectro-auth-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spectro_auth_local
      POSTGRES_USER: spectro
      POSTGRES_PASSWORD: spectro_local
    ports:
      - '127.0.0.1:5488:5432'
    volumes:
      - auth-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spectro -d spectro_auth_local']
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  auth-postgres-data:
