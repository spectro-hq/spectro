port: 4222
http_port: 8222
max_payload: 1048576
jetstream { store_dir: /data, max_file_store: 12GB }
authorization {
  users: [
    {
      user: ingest
      password: $NATS_INGEST_PASSWORD
      permissions: {
        publish: ["spectro.admitted.v1", "$JS.API.INFO", "$JS.API.STREAM.INFO.SPECTRO_ADMITTED", "$JS.API.STREAM.CREATE.SPECTRO_ADMITTED", "$JS.API.CONSUMER.INFO.SPECTRO_ADMITTED.spectro-processor-v1", "$JS.API.CONSUMER.CREATE.SPECTRO_ADMITTED.spectro-processor-v1.>", "$JS.API.CONSUMER.DURABLE.CREATE.SPECTRO_ADMITTED.spectro-processor-v1"]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: processor
      password: $NATS_PROCESSOR_PASSWORD
      permissions: {
        publish: ["$JS.API.INFO", "$JS.API.STREAM.INFO.SPECTRO_ADMITTED", "$JS.API.STREAM.CREATE.SPECTRO_ADMITTED", "$JS.API.CONSUMER.INFO.SPECTRO_ADMITTED.spectro-processor-v1", "$JS.API.CONSUMER.CREATE.SPECTRO_ADMITTED.spectro-processor-v1.>", "$JS.API.CONSUMER.DURABLE.CREATE.SPECTRO_ADMITTED.spectro-processor-v1", "$JS.API.CONSUMER.MSG.NEXT.SPECTRO_ADMITTED.spectro-processor-v1", "$JS.ACK.SPECTRO_ADMITTED.spectro-processor-v1.>"]
        subscribe: ["_INBOX.>", "$JS.EVENT.ADVISORY.>"]
      }
    }
  ]
}
