    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Spectro · Digital Product Observatory</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('spectro.color-theme');
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <!--

      STORY: A developer narrows a project window, scans mixed signals, selects one event, and reads its causal context without leaving the timeline.
