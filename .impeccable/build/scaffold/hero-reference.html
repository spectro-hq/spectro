<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scaffold reference: live-event-led.png</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gochi+Hand:wght@400&display=swap"
    />
    <link rel="stylesheet" href="layout.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        background: #f7f7f8;
      }
      .region {
        box-sizing: border-box;
      }
      .region.text p {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
    <main class="comp-frame" style="max-width: 1536px">
      <div class="r-scope-row region chrome" data-region="scope-row">
        <!-- Page title and scope control row -->
      </div>
      <div class="r-workbench-header region chrome" data-region="workbench-header">
        <!-- Ledger and selected-event header row -->
      </div>
      <div class="r-rail region chrome" data-region="rail">
        <!-- Existing Spectro navigation rail and brand -->
      </div>
      <div class="r-topbar region chrome" data-region="topbar">
        <!-- Existing breadcrumb and workspace controls -->
      </div>
      <div class="r-title region text" data-region="title">
        <!-- Live page heading -->
        <p
          style="
            font-size: var(--r-title-font);
            font-family: var(--r-title-family), sans-serif;
            font-weight: var(--r-title-weight);
            line-height: 1.05;
            margin: 0;
          "
        >
          title
        </p>
      </div>
      <div class="r-subtitle region text" data-region="subtitle">
        <!-- Observe new events as they become available -->
        <p style="font-size: var(--r-subtitle-font); line-height: 1.05; margin: 0">subtitle</p>
      </div>
      <div class="r-scope region control" data-region="scope">
        <!-- Project, environment and illustrative source: rebuild the control's chrome from the crop (comp-spec.mjs --crop scope); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-observation region control" data-region="observation">
        <!-- Observing status, update cadence and pause: rebuild the control's chrome from the crop (comp-spec.mjs --crop observation); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-filters region control" data-region="filters">
        <!-- Type, event name and session filters: rebuild the control's chrome from the crop (comp-spec.mjs --crop filters); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-ledger-heading region text" data-region="ledger-heading">
        <!-- New arrivals heading -->
        <p style="font-size: var(--r-ledger-heading-font); line-height: 1.05; margin: 0">
          ledger-heading
        </p>
      </div>
      <div class="r-new-events region control" data-region="new-events">
        <!-- Show four new events action: rebuild the control's chrome from the crop (comp-spec.mjs --crop new-events); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-batch-one region text" data-region="batch-one">
        <!-- Observation time group and three event rows -->
        <p style="font-size: var(--r-batch-one-font); line-height: 1.05; margin: 0">batch-one</p>
      </div>
      <div class="r-batch-two region text" data-region="batch-two">
        <!-- Second observation group and selected runtime error row -->
        <p style="font-size: var(--r-batch-two-font); line-height: 1.05; margin: 0">batch-two</p>
      </div>
      <div class="r-batch-three region text" data-region="batch-three">
        <!-- Third observation group and four event rows -->
        <p style="font-size: var(--r-batch-three-font); line-height: 1.05; margin: 0">
          batch-three
        </p>
      </div>
      <div class="r-batch-four region text" data-region="batch-four">
        <!-- Fourth observation group and two event rows -->
        <p style="font-size: var(--r-batch-four-font); line-height: 1.05; margin: 0">batch-four</p>
      </div>
      <div class="r-detail-heading region text" data-region="detail-heading">
        <!-- Selected runtime error with occurred and processed times -->
        <p style="font-size: var(--r-detail-heading-font); line-height: 1.05; margin: 0">
          detail-heading
        </p>
      </div>
      <div class="r-detail-tabs region control" data-region="detail-tabs">
        <!-- Event Context Raw tabs: rebuild the control's chrome from the crop (comp-spec.mjs --crop detail-tabs); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-context region text" data-region="context">
        <!-- Selected event context labels and values -->
        <p style="font-size: var(--r-context-font); line-height: 1.05; margin: 0">context</p>
      </div>
      <div class="r-payload-heading region control" data-region="payload-heading">
        <!-- Event payload title, format selector and Copy: rebuild the control's chrome from the crop (comp-spec.mjs --crop payload-heading); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-payload-code region text" data-region="payload-code">
        <!-- Read-only example JSON with line numbers -->
        <p style="line-height: 1.05; margin: 0">payload-code</p>
      </div>
    </main>
  </body>
</html>
