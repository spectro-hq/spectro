<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scaffold reference: schemas-reference-tabs.png</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oxygen:wght@700&display=swap"
    />
    <link rel="stylesheet" href="layout.css" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        background: #f7f7f8;
      }
      .region {
        box-sizing: border-box;
      }
      .region.text p {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
    <main class="comp-frame" style="max-width: 1487px">
      <div class="r-rail region chrome" data-region="rail">
        <!-- Existing Spectro application rail; Schemas selected. -->
      </div>
      <div class="r-topbar region chrome" data-region="topbar">
        <!-- Existing native collapse button, breadcrumb and theme control. -->
      </div>
      <div class="r-title region text" data-region="title">
        <!-- Schemas page title. -->
        <p
          style="
            font-size: var(--r-title-font);
            font-family: var(--r-title-family), sans-serif;
            font-weight: var(--r-title-weight);
            line-height: 1.05;
            margin: 0;
          "
        >
          title
        </p>
      </div>
      <div class="r-subtitle region text" data-region="subtitle">
        <!-- Supported event contracts. -->
        <p style="font-size: var(--r-subtitle-font); line-height: 1.05; margin: 0">subtitle</p>
      </div>
      <div class="r-versions region text" data-region="versions">
        <!-- Event v1 · Envelope v1. -->
        <p style="font-size: var(--r-versions-font); line-height: 1.05; margin: 0">versions</p>
      </div>
      <div class="r-index-common region control" data-region="index-common">
        <!-- Common contracts navigation: Envelope, Event, Context.: rebuild the control's chrome from the crop (comp-spec.mjs --crop index-common); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-index-payloads region control" data-region="index-payloads">
        <!-- Payload navigation: Session, Page, Error selected, Performance, Network, Interaction, Custom.: rebuild the control's chrome from the crop (comp-spec.mjs --crop index-payloads); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-detail-heading region text" data-region="detail-heading">
        <!-- Error payload heading. -->
        <p style="font-size: var(--r-detail-heading-font); line-height: 1.05; margin: 0">
          detail-heading
        </p>
      </div>
      <div class="r-description region text" data-region="description">
        <!-- Required fields and optional error context. -->
        <p style="font-size: var(--r-description-font); line-height: 1.05; margin: 0">
          description
        </p>
      </div>
      <div class="r-build-note region text" data-region="build-note">
        <!-- Reference for this Console build; ingestion versions may differ. -->
        <p style="font-size: var(--r-build-note-font); line-height: 1.05; margin: 0">build-note</p>
      </div>
      <div class="r-tabs region control" data-region="tabs">
        <!-- Fields active, Example, JSON Schema; thin active underline.: rebuild the control's chrome from the crop (comp-spec.mjs --crop tabs); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-table-heading region text" data-region="table-heading">
        <!-- Field, Type, Presence, Constraints table headers. -->
        <p style="font-size: var(--r-table-heading-font); line-height: 1.05; margin: 0">
          table-heading
        </p>
      </div>
      <div class="r-mechanism region text" data-region="mechanism">
        <!-- mechanism row: string, Required, enum runtime/promise/resource/manual. -->
        <p style="font-size: var(--r-mechanism-font); line-height: 1.05; margin: 0">mechanism</p>
      </div>
      <div class="r-message region text" data-region="message">
        <!-- message row: string, Required, 1–2048 characters. -->
        <p style="font-size: var(--r-message-font); line-height: 1.05; margin: 0">message</p>
      </div>
      <div class="r-handled region text" data-region="handled">
        <!-- handled row: boolean, Required. -->
        <p style="font-size: var(--r-handled-font); line-height: 1.05; margin: 0">handled</p>
      </div>
      <div class="r-name region text" data-region="name">
        <!-- name row: string, Optional, maximum 256 characters. -->
        <p style="font-size: var(--r-name-font); line-height: 1.05; margin: 0">name</p>
      </div>
      <div class="r-stack region text" data-region="stack">
        <!-- Expanded stack row and item structure; maximum 50 frames. Correct unsupported order claim. -->
        <p style="font-size: var(--r-stack-font); line-height: 1.05; margin: 0">stack</p>
      </div>
      <div class="r-fingerprint region text" data-region="fingerprint">
        <!-- Expanded fingerprint row and item structure; maximum 10 strings. -->
        <p style="font-size: var(--r-fingerprint-font); line-height: 1.05; margin: 0">
          fingerprint
        </p>
      </div>
      <div class="r-source region text" data-region="source">
        <!-- Expanded source object with url, line and column; correct URL format and minimum-value defects. -->
        <p style="font-size: var(--r-source-font); line-height: 1.05; margin: 0">source</p>
      </div>
      <div class="r-footer region control" data-region="footer">
        <!-- Runtime byte limits and local schema identifier with copy control, not a remote download link.: rebuild the control's chrome from the crop (comp-spec.mjs --crop footer); its ink box, border, fill, radius, and label size are the comp's -->
      </div>
      <div class="r-index-frame region chrome" data-region="index-frame">
        <!-- Contract index pane outline and ground; both navigation groups are measured separately. -->
      </div>
      <div class="r-workbench-top-rule region chrome" data-region="workbench-top-rule">
        <!-- Top outline of the single connected workbench. -->
      </div>
    </main>
  </body>
</html>
